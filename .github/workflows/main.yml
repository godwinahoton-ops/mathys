name: Exécution Trading Bot

on:
  schedule:
    # Exécute le script toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Lancer le script Python
        run: python main.py
